name: Update profile terminal

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (Fortaleza)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terminal/config.py"
      - "terminal/art.txt"
      - "terminal/generate.py"

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Generate terminal SVGs
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python terminal/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/dark.svg terminal/light.svg terminal/.cache
          git diff --cached --quiet || git commit -m "chore: update profile terminal"
          git push
